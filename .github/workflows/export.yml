name: Job Radar — JSON Export

# Publishes state/jobs_export.json for the 7 AM / 11 AM ET h1b job-check task.
# Runs shortly before each check (both EDT and EST times covered), weekdays only,
# to keep repo growth small (~1-2 MB compressed per commit).
on:
  schedule:
    - cron: "45 10,11,14,15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export recent jobs to JSON
        run: python tools/export_jobs_json.py --out state/jobs_export.json --days 14

      - name: Commit export
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/jobs_export.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update jobs export [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }}
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            sleep 3
          done
          echo "Export push failed after 3 attempts."
          exit 1
